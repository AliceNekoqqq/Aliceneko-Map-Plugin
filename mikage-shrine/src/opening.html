<script>window.OpeningStoryData=[{"id": "opening-1", "title": "修缮现场初遇", "subtitle": "从一杯温茶开始，先说说你的来意。", "text": "御影神社的回廊边放着几块待更换的木板，屋檐下的灰尘还没扫完。一个银白发、长着狐耳的男人收起手里的工具，抬眼看向{{user}}所在的方向。\n\n“若是来参拜，主殿在里面。若是来找人——”他停顿一下，像是重新判断你的来意，“这里最近确实缺帮手，但我不收不明不白的委托。”\n\n他把一杯温茶放在廊边，给你留出位置。\n\n“你可以先说说来意。或者只坐一会儿，也行。”\n\n<StatusPlaceHolderImpl/>"}, {"id": "opening-2", "title": "带着心愿的来访者", "subtitle": "有人带着一块断裂的木牌，等你听完心愿。", "text": "一位来访者站在鸟居外，手里握着一块断裂的木牌。巴卫从回廊走出来，没有立刻接过东西，只看了看对方，又转向你。\n\n“说是想把它修好，但真正想问的恐怕不是木工。”他语气平淡，没有替来访者把话说完。\n\n对方犹豫着抬头。巴卫侧身让开通往回廊的路：“要不要听？接不接这件事，由{{user}}决定。”\n\n<StatusPlaceHolderImpl/>"}, {"id": "opening-3", "title": "神社的安静午后", "subtitle": "没有急事的午后，收拾庭院，或一起喝茶。", "text": "午后的神社很安静，只有扫帚擦过石阶的声音。巴卫把修缮工具收进木箱，发现{{user}}在庭院边停下，便抬手拂掉袖口沾着的木屑。\n\n“今天没有急事。”他看着尚未整理完的院子，“可以把这里收拾好，也可以先喝茶。你若有别的打算，就直说。”\n\n他没问你从哪里来，也没替你决定留下，只把两只茶杯放到了回廊桌上。\n\n<StatusPlaceHolderImpl/>"}];window.OpeningPreview=false;</script><script>/* Fixed artwork and a local title page. Only an explicit start invokes host mutation. */

  const cleanups=[];

      const nodes=[$(id).querySelector('img'),...document.querySelectorAll('.profile[data-actor="'+actor+'"] img')];
      for(const img of nodes){
        if(!img)continue;
        let frame=img.parentElement;
        if(!frame.classList.contains('portrait-frame')){frame=document.createElement('span');frame.className='portrait-frame '+(img.closest('.profile')?'profile-portrait':'actor-portrait');img.replaceWith(frame);frame.append(img);}
        img.src=art.portrait(actor,appearance[actor]);
        if(typeof art.paintPortrait==='function')art.paintPortrait(frame,actor,appearance[actor]);
      }
    }
  }
  function setAppearance(value){if(value&&typeof value==='object'){appearance={player:String(value.player||'daily'),tomoe:String(value.tomoe||'usual')};paintPortraits();}}
  function connect(bridge){window.OpeningBridge=bridge;readOnly=bridge?.readOnly===true;resize();bridge?.getAppearance?.().then?.(setAppearance);unsubscribeAppearance?.();unsubscribeAppearance=bridge?.subscribeAppearance?.(setAppearance)||null;}
  function say(value){clearTimeout(speechTimer);$('greeting').textContent=value;speechTimer=setTimeout(()=>{if(!disposed)$('greeting').textContent='山灯初上，等一人来。';},7000);}
  function close(){if(busy)return;overlay.hidden=true;focusBefore?.focus();}
  function page(name,opener){
    focusBefore=opener||document.activeElement;content.querySelectorAll('.portrait-frame').forEach(el=>artApi()?.releasePortrait?.(el));content.replaceChildren();$('dialog-status').textContent='';overlay.hidden=false;
    const titles={guide:'把日子，慢慢过成故事',world:'鸟居之后，还有人间',people:'相逢于御影神社',stories:'选择故事的第一页'};$('dialog-title').textContent=titles[name];
    $('dialog-kicker').textContent=name==='stories'?'从这里，走进你的物语':'御影神社手帖';
    if(name==='guide'){
      paragraph('你可以接待来客、翻看绘马、与巴卫修缮神社，也可以只喝茶、闲聊或下山走走。没有必须立刻完成的日程。');
      heading('一枚绘马，一段心愿');paragraph('从状态栏打开绘马板，翻面读完愿望，再决定接不接。通过查访、商议和实际行动帮助来客；不必强行和解，接受未知也可以留下余韵。');
      heading('一点一点，让神社热闹起来');paragraph('普通绘马的固定回礼用于建设。鸟居、参道、拜殿、社务所、庭院依次展开，材料与可前往的地区随阶段增加，像素场景会显示不同施工节点。');
      heading('主线由你翻开');paragraph('本阶段普通委托数量达标、活动心愿收束后，会多出一枚特殊绘马。主动接取才进入主线；对应设施完工与剧情回应齐全后进入下一章。五章结束，仍可自由游玩。');
      paragraph('进入开场后，直接回复巴卫即可。面孔和发型保持一致，衣装可以在衣柜切换；你的身世、性格与决定仍由你自己书写。','note');
    }else if(name==='world'){
      paragraph('现代日本的一隅，御影神社藏在山路与树影之间。它仍能接待参拜者，只是有些木板待换，旧路待整，庭院也还空着几处。');
      paragraph('巴卫是守护这里的狐妖神使。御影长久不归，他依然料理茶饭、巡视参道，也依然对“不请自来”的麻烦没有好脸色。');
      paragraph('人类、妖怪与偶尔到访的幽灵，把没有说完的话写上绘马。失物、误会、约定、离别——你们能做的是给出机会，而非替别人决定心意。');
      paragraph('来客终会沿着石阶离开。修好的鸟居、添上的灯，还有渐渐熟悉的脚步声，会留在这里。');
      paragraph('原作人物背景取自《元气少女缘结神》；本卡的建设、委托与后续剧情为原创展开，不强制复现原作时间线。','note');
    }else if(name==='people'){
      const list=[{name:'巴卫',img:'tomoe',body:'银白狐耳的神使，冷静、挑剔、做事利落。嘴上不饶人，保护和照料往往先落在行动里。他有自己的判断，也会与你争执、磨合。'},{name:'你 · 唯一的玩家主角',img:'heroine',body:'以奈奈生外观为参考的固定像素形象：长棕发，衣装随衣柜切换。这里没有另一位独立女主，也不替你设定身世、前世或既定恋爱关系。'}];
      for(const p of list){const box=document.createElement('article');box.className='profile';box.dataset.actor=p.img==='tomoe'?'tomoe':'player';const img=document.createElement('img');img.src=$(p.img).querySelector('img').src;img.alt=p.name;const body=document.createElement('div');body.append(text('h3',p.name),text('p',p.body));box.append(img,body);content.append(box);}
      paragraph('角色图在每次打开与重播时使用同一份素材。开始故事不会自动缔结神使契约，也不会增加好感或改变材料。','note');
    }else{
      paragraph(readOnly?'这是一段只供回看的标题页。故事已经开始，无法从这里替换第一页。':'选择一种相逢的气氛。无论从哪一页开始，人物背景和选择权都留给你。');
      stories.forEach((story,i)=>{const button=document.createElement('button');button.type='button';button.className='story-choice';button.disabled=readOnly;button.dataset.storyId=story.id;button.append(text('small','第 '+['一','二','三'][i]+' 页'),text('b',story.title),text('span',story.subtitle));button.addEventListener('click',()=>start(story,button));content.append(button);});
      paragraph('开场只是一次邀请。之后如何回应、是否留下、接不接委托，都由你决定。','note');
    }
    if(name==='people')paintPortraits();
    dialog.focus();
  }
  async function start(story,button){
    if(busy)return;busy=true;button.disabled=true;$('dialog-status').textContent='正在翻开第一页……';
    try{
      if(window.OpeningBridge){await window.OpeningBridge.start(story.id);if(!disposed)$('dialog-status').textContent='已展开开场，接着聊天即可。';}
      else if(window.OpeningPreview===true){
        overlay.hidden=true;$('preview-title').textContent=story.title;
        $('preview-text').textContent=story.text.replace(/\{\{user\}\}/g,'你').replace(/<StatusPlaceHolderImpl\/>/g,'').trim();$('story-preview').hidden=false;$('back-title').focus();
      }else throw new Error('酒馆桥接尚未就绪，请稍候重试；开场还没有改变。');
    }catch(error){if(!disposed)$('dialog-status').textContent=error.message||'未能展开开场，请重试。';}
    finally{busy=false;if(!disposed)button.disabled=false;}
  }
  function stopAudio(){clearInterval(audioTimer);audioTimer=null;soundOn=false;if(audio){const ctx=audio;audio=null;ctx.close().catch(()=>{});}if(!disposed){$('sound').setAttribute('aria-pressed','false');$('sound-label').textContent='静音';$('sound').setAttribute('aria-label','开启铃音');}}
  async function toggleAudio(){
    if(soundOn){stopAudio();return;}
    try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('当前浏览器暂不支持铃音。');audio=new Audio();await audio.resume();if(disposed){stopAudio();return;}soundOn=true;let step=0;const notes=[523.25,659.25,783.99,880,783.99,659.25,587.33,659.25];
      const ring=()=>{if(!audio||!soundOn||document.hidden)return;const ctx=audio,t=ctx.currentTime;const oscillator=ctx.createOscillator(),gain=ctx.createGain();oscillator.type='sine';oscillator.frequency.value=notes[step++%notes.length];gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.045,t+.04);gain.gain.exponentialRampToValueAtTime(.0001,t+1.7);oscillator.connect(gain);gain.connect(ctx.destination);oscillator.start(t);oscillator.stop(t+1.8);};ring();audioTimer=setInterval(ring,1700);$('sound').setAttribute('aria-pressed','true');$('sound').setAttribute('aria-label','关闭铃音');$('sound-label').textContent='铃音';
    }catch(error){stopAudio();say(error.message);}
  }
  function sakuraMotion(){game.classList.toggle('sakura-paused',disposed||document.hidden||!sakuraVisible);}
  function resize(){game.style.setProperty('--sakura-travel',(game.clientHeight+60)+'px');const bridge=window.OpeningBridge;if(bridge?.resize)bridge.resize(game.offsetHeight);}
  function dispose(){if(disposed)return;disposed=true;document.querySelectorAll('.portrait-frame').forEach(el=>artApi()?.releasePortrait?.(el));sakuraMotion();sakuraObserver?.disconnect();unsubscribeAppearance?.();unsubscribeAppearance=null;stopAudio();clearTimeout(speechTimer);resizeObserver?.disconnect();cleanups.forEach(fn=>fn());}
  // A bounded, pre-staggered field stays alive after the entry sequence. The
  // fall and flutter use separate transforms, so no timer or new nodes recur.
  for(let i=0;i<24;i++){
    const flight=document.createElement('i'),petal=document.createElement('span');flight.className='sakura-flight';petal.className='sakura-petal';
    flight.style.setProperty('--sakura-left',((i*37+7)%103-2)+'%');flight.style.setProperty('--sakura-duration',(13+i%10)+'s');flight.style.setProperty('--sakura-delay',(-i*2.37-3)+'s');
    flight.style.setProperty('--sakura-wind',((i%2?1:-1)*(20+i%5*9))+'px');flight.style.setProperty('--sakura-size',(i%3===0?5:7+i%4)+'px');flight.style.setProperty('--sakura-opacity',i%3===0?'.4':'.78');
    petal.style.setProperty('--sakura-flutter',(3+i%5*.65)+'s');flight.append(petal);$('petals').append(flight);
  }
  if(typeof IntersectionObserver==='function'){sakuraObserver=new IntersectionObserver(entries=>{sakuraVisible=entries.some(entry=>entry.isIntersecting);sakuraMotion();});sakuraObserver.observe(game);}sakuraMotion();
  document.querySelectorAll('[data-page]').forEach(button=>on(button,'click',()=>page(button.dataset.page,button)));
  on($('close'),'click',close);on(overlay,'click',event=>{if(event.target===overlay)close();});
  on(document,'keydown',event=>{
    if(overlay.hidden){if(event.key==='Escape'&&readOnly){event.preventDefault();window.OpeningBridge?.close?.();}return;}if(event.key==='Escape'){event.preventDefault();close();return;}
    if(event.key==='Tab'){const items=[...dialog.querySelectorAll('button:not(:disabled),[tabindex="0"]')].filter(el=>!el.hidden);const first=items[0],last=items.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){event.preventDefault();last?.focus();}else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first?.focus();}}
  });
  on($('wardrobe'),'click',()=>{const bridge=window.OpeningBridge;if(bridge?.openWardrobe){Promise.resolve(bridge.openWardrobe()).catch(()=>say('衣柜暂时无法打开。'));}else say('衣柜暂时无法打开。');});on($('skip'),'click',()=>{game.classList.add('skip-intro');$('skip').textContent='入场已跳过';});
  on($('replay'),'click',()=>{if(readOnly){return;}game.classList.remove('entering','skip-intro');void game.offsetWidth;game.classList.add('entering');$('skip').textContent='跳过入场 ›';});
  on($('tomoe'),'click',()=>say('巴卫：“茶还温着。你的来意，坐下再说。”'));
  on($('heroine'),'click',()=>say('这一页留给你。名字、来处，以及下一步。'));
  on($('sound'),'click',toggleAudio);on($('back-title'),'click',()=>{$('story-preview').hidden=true;document.querySelector('[data-page="stories"]').focus();});
  on(document,'visibilitychange',()=>{sakuraMotion();if(document.hidden&&soundOn)stopAudio();});on(window,'pagehide',dispose);on(window,'resize',resize);on(window,'mikage-opening-ready',()=>{resize();paintPortraits();});on(window,'mikage:art-ready',paintPortraits);
  if(typeof ResizeObserver==='function'){resizeObserver=new ResizeObserver(resize);resizeObserver.observe(game);}
  window.OpeningScreen={connect,dispose,setAppearance,setReadOnly(value){readOnly=!!value;}};if(window.OpeningBridge)connect(window.OpeningBridge);paintPortraits();resize();
})();
</script>
